# Example behind an HTTPS-terminating load balancer.
# APP_ORIGIN must match the public HTTPS origin.
server {
    listen 80;
    server_name _;
    root /srv/munim/apps/web/dist;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ^~ /api/v1/receipts/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:3000;
    }
    location ^~ /receipt/ {
        access_log off;
        error_log /dev/null;
        try_files $uri /index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:3000;
    }
    location = /sw.js {
        add_header Cache-Control no-cache;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
