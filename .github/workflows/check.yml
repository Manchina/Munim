name: Check
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: munim
          POSTGRES_PASSWORD: munim
          POSTGRES_DB: munim_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U munim" --health-interval=5s --health-retries=10
    env:
      TEST_DATABASE_URL: postgres://munim:munim@localhost:5432/munim_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm exec -- playwright test
